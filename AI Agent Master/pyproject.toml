[project]
name = "ai-agent-master-answers"
version = "1.0.0"
description = "AI Agent Master 22 章可运行标准答案"
requires-python = ">=3.12,<3.15"
dependencies = [
  "pydantic>=2,<3",
  "httpx>=0.27,<1",
  "fastapi>=0.115,<1",
]

[project.optional-dependencies]
frameworks = [
  "langgraph>=1",
  "openai-agents>=0.4",
  "mcp[cli]>=1",
]
test = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["."]
python_files = ["test_solution.py"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.ruff]
target-version = "py312"
line-length = 100


<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>流与Worker · JS 进阶训练</title>
    <link rel="stylesheet" href="/web/style.css" />
  </head>
  <body>
    <header>
      <a href="/">← 训练入口</a>
      <h1>逐批处理，给取消留下执行机会</h1>
      <span class="badge" id="mode"></span>
      <p class="muted">
        先读对应单元题目。修改 src 后刷新本页；参考实现通过不代表自己的练习已完成。
      </p>
    </header>
    <section>
      <p>
        固定数据：5,000 行，value = id % 100。完整结果应为 count = 5000、sum =
        247500。应用每批最多持有 128 行，收到 Worker 应答后才提交下一批。
      </p>
      <div class="bar">
        <button id="start">开始处理</button
        ><button id="cancel" class="secondary" disabled>取消本次处理</button
        ><button id="probe" class="secondary">验证 Worker 正在计算时取消</button>
      </div>
      <p id="status" class="status" role="status" aria-live="polite">准备就绪</p>
      <pre id="metrics"></pre>
      <p class="muted">
        取消探针把一个大任务发给真实 Worker；Worker 发出 started
        后，主线程再发取消消息。完整记录该消息到取消应答的时间。
      </p>
    </section>
    <script type="module" src="/web/stream.js"></script>
  </body>
</html>
